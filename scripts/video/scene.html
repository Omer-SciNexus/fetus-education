<!doctype html>
<html lang="en"><meta charset="utf-8"><title>A Little Sun — animation source</title>
<style>html,body{margin:0;background:#100e1b}canvas{display:block;width:100%;height:auto}</style>
<canvas id="film" width="1280" height="720"></canvas>
<script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d');
const W=1280,H=720,TAU=Math.PI*2;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=v=>{v=clamp(v);return v*v*(3-2*v)};
const mix=(a,b,t)=>a+(b-a)*t;
const stages=[
 {start:5,end:11,week:'AROUND WEEK 2',title:['A spark','of possibility.'],sub:'Conception',line:'The journey begins with a single cell.',kind:'cell',size:0.28},
 {start:11,end:17,week:'WEEKS 3–4',title:['Small beginnings.','Endless wonder.'],sub:'Dividing cells · implantation',line:'A tiny cluster begins to find its home.',kind:'cells',size:0.4},
 {start:17,end:24,week:'WEEKS 5–8',title:['Life begins','to take shape.'],sub:'The embryo grows',line:'The earliest structures begin to form.',kind:'embryo',size:0.54},
 {start:24,end:31,week:'WEEKS 9–12',title:['A little more you.','Every day.'],sub:'Early fetal development',line:'A small, growing form. A widening world.',kind:'fetus',size:0.65},
 {start:31,end:38,week:'WEEKS 13–20',title:['Growing into','the light.'],sub:'The second trimester',line:'Little limbs move as the journey continues.',kind:'fetus',size:0.77},
 {start:38,end:45,week:'WEEKS 21–28',title:['A world of hope,','held within.'],sub:'Growth and development continue',line:'Each passing week brings new changes.',kind:'fetus',size:0.88},
 {start:45,end:52,week:'WEEKS 29–36',title:['Closer to','your sunrise.'],sub:'The third trimester',line:'Growing, maturing, preparing to meet you.',kind:'fetus',size:1.0},
 {start:52,end:59,week:'WEEKS 37–40',title:['Almost time','to meet the sun.'],sub:'Approaching birth',line:'A new beginning is drawing near.',kind:'fetus',size:1.1},
];
let seed=85;const random=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};
const stars=Array.from({length:160},()=>({x:random()*W,y:random()*H,r:random()*1.5+.3,p:random()*TAU,v:random()*.8+.2}));
const dust=Array.from({length:85},()=>({a:random()*TAU,r:random()*270+35,s:random()*2+.5,p:random()*TAU}));
function ellipse(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fillStyle=fill;ctx.fill()}
function glow(x,y,r,color,alpha=1){ctx.save();ctx.globalAlpha*=alpha;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'transparent');ellipse(x,y,r,r,g);ctx.restore()}
function path(d,fill,stroke,width=1){const p=new Path2D(d);if(fill){ctx.fillStyle=fill;ctx.fill(p)}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke(p)}}
function text(s,x,y,size=20,color='#f9e9cf',family='Arial',align='left'){ctx.fillStyle=color;ctx.font=`${size}px ${family}`;ctx.textAlign=align;ctx.fillText(s,x,y)}
function spaced(s,x,y,size=12,space=3,color='#d9b781',align='left'){ctx.font=`${size}px Arial`;let width=[...s].reduce((n,k)=>n+ctx.measureText(k).width+space,0)-space;if(align==='center')x-=width/2;ctx.fillStyle=color;for(const k of s){ctx.fillText(k,x,y);x+=ctx.measureText(k).width+space}}
function background(t){const dawn=ease((t-58)/8);const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0d1224');g.addColorStop(.5,'#221525');g.addColorStop(1,'#3b2130');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);glow(870,330,520,`rgba(170,83,40,${.17+dawn*.38})`);glow(150,620,570,'rgba(66,58,113,.17)');for(const s of stars){const y=(s.y-t*s.v*1.7+H*4)%H;ctx.globalAlpha=(.18+.45*(.5+.5*Math.sin(t*.7+s.p)))*(1-dawn*.7);ellipse(s.x,y,s.r,s.r,'#ffdea5')}ctx.globalAlpha=1;
 // Thin orbital arcs keep the composition quiet and spacious.
 ctx.strokeStyle='rgba(246,200,130,.055)';ctx.lineWidth=1;for(let i=0;i<3;i++){ctx.beginPath();ctx.ellipse(880,335,270+i*48,264+i*35,-.2,0,TAU);ctx.stroke()}}
function rays(x,y,t,strength=1){ctx.save();ctx.translate(x,y);ctx.rotate(t*.025);for(let i=0;i<48;i++){ctx.save();ctx.rotate(i*TAU/48);const len=230+Math.sin(i*13.1)*65;const g=ctx.createLinearGradient(0,30,0,len);g.addColorStop(0,`rgba(255,213,128,${.12*strength})`);g.addColorStop(1,'rgba(255,194,85,0)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-2,45);ctx.lineTo(-12,len);ctx.lineTo(12,len);ctx.lineTo(2,45);ctx.fill();ctx.restore()}ctx.restore()}
function magic(x,y,t,amount=1){ctx.save();ctx.globalCompositeOperation='screen';for(const p of dust){const a=p.a+t*.085;const r=p.r*(.94+.04*Math.sin(t*.6+p.p));const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r*.91;const alpha=(.15+.6*(.5+.5*Math.sin(t*1.2+p.p)))*amount;glow(px,py,p.s*5,`rgba(255,191,90,${alpha*.45})`);ellipse(px,py,p.s,p.s,`rgba(255,223,164,${alpha})`);if(p.s>2.1){ctx.strokeStyle=`rgba(255,231,186,${alpha*.65})`;ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(px-5,py);ctx.lineTo(px+5,py);ctx.moveTo(px,py-5);ctx.lineTo(px,py+5);ctx.stroke()}}ctx.restore()}
function womb(x,y,t,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);const breathe=1+.008*Math.sin(t*1.2);ctx.scale(breathe,breathe);glow(0,0,260,'rgba(221,119,50,.18)');const g=ctx.createRadialGradient(-45,-80,20,0,0,230);g.addColorStop(0,'rgba(251,193,113,.09)');g.addColorStop(.85,'rgba(197,107,78,.06)');g.addColorStop(.98,'rgba(255,206,146,.12)');g.addColorStop(1,'rgba(255,206,146,0)');ellipse(0,0,224,242,g);ctx.strokeStyle='rgba(255,212,152,.22)';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(0,0,220,237,-.11,-2.8,2.8);ctx.stroke();ctx.strokeStyle='rgba(255,222,181,.36)';ctx.beginPath();ctx.ellipse(0,0,225,242,-.11,-2.6,-1.1);ctx.stroke();ctx.restore()}
function cell(t,multi=false){glow(0,0,130,'rgba(255,198,101,.27)');const n=multi?8:1;for(let i=0;i<n;i++){const a=i*2.39996;const r=multi?Math.sqrt(i)*20:0;const x=Math.cos(a)*r,y=Math.sin(a)*r;const radius=multi?31:56;const g=ctx.createRadialGradient(x-12,y-18,2,x,y,radius);g.addColorStop(0,'#fff2ca');g.addColorStop(.3,'#ecc58b');g.addColorStop(.8,'#a26843');g.addColorStop(1,'#f3d7a2');ellipse(x,y,radius,radius,g);glow(x-9,y-12,14,'rgba(255,252,218,.7)');ellipse(x+4,y+3,8,8,'rgba(109,64,44,.4)')}
 if(!multi){ctx.strokeStyle='rgba(255,220,160,.6)';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(0,0,65+Math.sin(t)*2,0,TAU);ctx.stroke();const p=clamp((t-5)/3);ctx.save();ctx.translate(-180+120*ease(p),30*(1-p));glow(0,0,19,'rgba(255,224,153,.7)');ellipse(0,0,7,4,'#ffefbe');ctx.strokeStyle='#d9bc82';ctx.beginPath();ctx.moveTo(-5,0);ctx.bezierCurveTo(-25,Math.sin(t*6)*9,-35,-9,-55,0);ctx.stroke();ctx.restore()}}
function embryo(t){ctx.save();ctx.rotate(-.2+Math.sin(t*.8)*.02);const g=ctx.createLinearGradient(-70,-120,90,160);g.addColorStop(0,'#ffdfb4');g.addColorStop(.35,'#d6a27b');g.addColorStop(.7,'#986151');g.addColorStop(1,'#f5c393');path('M 20 -91 C -45 -143 -102 -84 -98 -20 C -96 38 -53 103 0 126 C 35 142 60 119 45 99 C 24 73 -5 65 -9 34 C 48 38 69 -10 51 -49 C 46 -65 35 -82 20 -91 Z',g,'#eac397',1.4);glow(-40,-60,70,'rgba(255,236,187,.23)');ellipse(15,-47,8,9,'#76534b');path('M -57 -13 C -68 41 -27 98 15 108',null,'rgba(255,223,177,.6)',2);for(let i=0;i<8;i++){const a=-.15+i*.16;ellipse(-54+i*5,8+i*10,5,2.5,'rgba(252,211,160,.34)')}ellipse(-2,41,14,9,'#d4a17c');ellipse(12,83,10,7,'#cf9875');ctx.restore()}
function fetus(t,scale=1,newborn=false){ctx.save();ctx.scale(scale,scale);ctx.rotate(-.13+Math.sin(t*.55)*.026+(newborn?.22:0));
 const skin=ctx.createLinearGradient(-100,-145,115,160);skin.addColorStop(0,'#ffe5bb');skin.addColorStop(.27,'#e7bd91');skin.addColorStop(.62,'#b98066');skin.addColorStop(1,'#754844');const light='#f3cfa0';
 // Umbilical cord behind the baby, connected to the abdomen.
 if(!newborn){path('M 24 57 C 106 92 150 52 146 1 C 140 -61 181 -74 196 -116',null,'rgba(213,148,105,.42)',13);path('M 24 57 C 106 92 150 52 146 1 C 140 -61 181 -74 196 -116',null,'rgba(253,210,155,.55)',3)}
 // Curved torso, neck and head with a gentle right-facing facial profile.
 path('M -62 -66 C -102 -43 -119 8 -110 59 C -103 111 -58 145 -12 127 C 20 113 51 78 38 38 C 31 13 8 -4 4 -26 L 6 -60 Z',skin,light,1.2);
 path('M -66 -62 C -110 -72 -121 -118 -102 -153 C -81 -191 -22 -196 12 -167 C 36 -147 38 -116 31 -100 C 30 -95 37 -87 43 -81 C 48 -74 38 -70 32 -70 C 38 -58 30 -49 19 -49 C 15 -35 -1 -28 -19 -34 C -38 -37 -48 -49 -48 -60 Z',skin,light,1.2);
 // Soft cheek volume, ear and closed eye.
 glow(-56,-134,61,'rgba(255,236,189,.32)');glow(7,-80,30,'rgba(245,180,139,.3)');
 path('M 11 -103 Q 21 -97 28 -103',null,'#805747',2.2);path('M 25 -63 Q 31 -60 34 -63',null,'#925e4b',1.4);
 ellipse(-34,-90,11,16,'#cd9978');path('M -31 -100 C -45 -102 -42 -78 -31 -82',null,'#a26e55',1.6);
 // Far leg, folded thigh and shin.
 path('M -33 94 C -2 112 45 115 57 91 C 64 77 58 63 47 61 C 35 61 23 79 8 77 L -16 65 Z','#b78066','#dfaf88',1);
 path('M -50 88 C -26 52 14 39 40 57 C 64 74 41 102 18 110 C 3 117 -10 124 -19 132 C 0 132 24 136 24 149 C 20 164 -9 162 -34 155 C -60 147 -73 120 -50 88 Z',skin,light,1.3);
 // Near arm lifted toward the face; the hand has a small curved thumb.
 const movement=Math.sin(t*1.4)*2;
 ctx.save();ctx.translate(movement,0);path('M -46 -26 C -24 -27 -11 -10 -3 11 C 4 24 18 28 29 17 L 43 -5 C 50 -15 58 -12 59 -5 C 65 -6 70 1 65 8 C 67 18 58 29 48 34 C 32 53 13 62 -6 48 C -21 38 -30 17 -43 12 C -59 8 -61 -16 -46 -26 Z',skin,light,1.3);path('M 42 8 Q 50 15 54 16 M 39 15 Q 46 22 50 23 M 33 22 Q 40 28 44 29',null,'#b47e60',1);ctx.restore();
 path('M -83 -28 C -108 21 -95 75 -67 96',null,'rgba(255,224,179,.3)',2.3);
 // Quiet inner light, symbolic rather than a heartbeat or medical scan.
 glow(-37,14,65,'rgba(255,206,119,.17)');ctx.restore()}
function subject(stage,t,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.translate(874,330+Math.sin(t*.7)*4);const growth=stage.size;ctx.scale(1+(t-stage.start)*.003,1+(t-stage.start)*.003);if(stage.kind==='cell'||stage.kind==='cells'){cell(t,stage.kind==='cells')}else if(stage.kind==='embryo'){ctx.scale(.9,.9);embryo(t)}else{fetus(t,growth)}ctx.restore()}
function stageCopy(stage,t,alpha){ctx.save();ctx.globalAlpha=alpha;const yOffset=(1-alpha)*12;spaced(stage.week,90,227+yOffset,12,3);stage.title.forEach((s,i)=>text(s,86,294+i*62+yOffset,55,'#fff0d9','Georgia'));text(stage.sub,90,405+yOffset,18,'#e2bd89');text(stage.line,90,440+yOffset,15,'#b9a8ab');ctx.restore()}
function timeline(t){const visible=ease((t-5)/1)*(1-ease((t-58)/1));if(!visible)return;ctx.save();ctx.globalAlpha=visible;const x0=90,x1=1190,y=610,p=clamp((t-5)/54);ctx.lineWidth=1;ctx.strokeStyle='#695043';ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();ctx.strokeStyle='#e9bd7a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(mix(x0,x1,p),y);ctx.stroke();const weeks=['2','4','8','12','20','28','36','40'];for(let i=0;i<8;i++){let x=mix(x0,x1,i/7);ellipse(x,y,3,3,i/7<p?'#f7d59f':'#79604d');text(weeks[i],x,y+26,12,'#bfa88f','Arial','center')}glow(mix(x0,x1,p),y,17,'rgba(255,210,130,.6)');ellipse(mix(x0,x1,p),y,4,4,'#fff0c5');text('PREGNANCY WEEKS',90,578,10,'#c5a87d');text('An artistic journey · stages are approximate and not to scale',1190,676,11,'#a7979d','Arial','right');ctx.restore()}
window.renderFrame=function(t){ctx.clearRect(0,0,W,H);background(t);ctx.textAlign='left';spaced('L I T T L E   B L O O M',90,64,11,1.5,'#d8bd98');text('A LITTLE SUN',1190,64,11,'#b9a39a','Arial','right');ctx.textAlign='left';
 const begin=ease((t-3.8)/1.3),end=ease((t-58)/3);
 if(t<6){ctx.save();ctx.globalAlpha=(1-ease((t-4.1)/1.1))*ease(t/1.2);glow(640,296,170,'rgba(255,193,95,.22)');rays(640,290,t,.6);ellipse(640,264,7,7,'#fff1c9');spaced('FROM A SPARK TO A SUNRISE',640,354,12,3,'#d9b781','center');text('A little sun.',640,437,74,'#fff0d9','Georgia','center');text('The story of a life, growing in light.',640,482,20,'#cfb8a7','Arial','center');ctx.restore()}
 if(t>=4&&t<61){ctx.save();ctx.globalAlpha=begin*(1-end);womb(874,330,t);rays(874,330,t,.45+clamp((t-17)/42)*.8);magic(874,330,t);ctx.restore();
 for(let i=0;i<stages.length;i++){const s=stages[i];const a=ease((t-s.start)/1.1)*(1-ease((t-s.end)/1.1))*(1-end);if(a>0){subject(s,t,a);stageCopy(s,t,a)}}timeline(t)}
 if(t>58){ctx.save();ctx.globalAlpha=ease((t-58)/2);const x=mix(874,640,ease((t-59)/3)),y=mix(330,292,ease((t-59)/3));rays(x,y,t,2);glow(x,y,330,'rgba(255,188,74,.22)');glow(x,y,202,'rgba(255,204,116,.31)');const sun=ctx.createRadialGradient(x-40,y-50,10,x,y,150);sun.addColorStop(0,'rgba(255,236,178,.6)');sun.addColorStop(.8,'rgba(255,192,84,.3)');sun.addColorStop(1,'rgba(255,178,74,0)');ellipse(x,y,154,154,sun);magic(x,y,t,.6);ctx.save();ctx.translate(x,y+24);fetus(t,.73,true);ctx.restore();ctx.globalAlpha*=ease((t-61)/1.8);spaced('BIRTH · A NEW BEGINNING',640,499,12,2.6,'#e9c58e','center');text('A little life. A whole world of hope.',640,555,43,'#fff0d5','Georgia','center');text('Like the sun, you bring a new day.',640,598,20,'#dbc2a8','Arial','center');ctx.restore()}
 // A gentle fade to the same warm dark at the very end.
 ctx.fillStyle=`rgba(15,13,25,${ease((t-67)/1)})`;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;ctx.textAlign='left';
};window.renderFrame(55);
